server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: car-hunter

management:
  endpoints:
    web:
      exposure:
        include: health,info

carhunter:
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.sprites.dev/v1/gateway/openai}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
    max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:2500}
  tavily:
    # Fly.io Tavily Connector URL, without the /search suffix.
    base-url: ${TAVILY_BASE_URL:}
